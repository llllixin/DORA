services:
  postgres:
    image: postgres:16
    container_name: dora-postgres
    environment:
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: dora
      POSTGRES_DB: dora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
